# Batchdefinitie voor de matrix. Draaien: make -C worker run
#
# Analyse is al gedraaid (analysis/ai/); LUT staat uit tot lut/campaign.cube
# bestaat — dan draaien we de -lut-cellen alsnog.
#
# Prompts: na de stijlanalyse aangepast aan het campagnethema (connectiviteit,
# spreiding jong-oud, binnen/buiten). 🧑 Elmar kan ze altijd bijstellen; een
# cel opnieuw draaien kost ~$0,03-0,15 per beeld.

client_id: act-case
analyze: false
train:
  enabled: false      # LoRA staat al in models/; opnieuw trainen kost ~$2
  steps: [1000]

variants: [prompt, multiref, lora]
lut: [false]

prompts:
  - id: p1
    text: "a woman in her sixties waving at her smartphone during a video call in her backyard"
  - id: p2
    text: "a young man with wireless earbuds listening to music, eyes closed, leaning against a brick wall on a city street"
  - id: p3
    text: "two friends laughing together at a smartphone screen on a couch in a living room"
